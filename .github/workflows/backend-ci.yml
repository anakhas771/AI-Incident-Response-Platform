name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_platform_test
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Cache Ruff & MyPy
        uses: actions/cache@v4
        with:
          path: |
            backend/.ruff_cache
            backend/.mypy_cache
          key: ${{ runner.os }}-python-${{ hashFiles('backend/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

          echo "Python:"
          python --version

          echo "Ruff:"
          ruff --version

          echo "Mypy:"
          mypy --version

          pip freeze

      - name: Environment Information
        run: |
          pwd
          git rev-parse HEAD
          git status

          python --version
          pip --version
          ruff --version
          mypy --version
          pytest --version

          echo ""
          echo "===== pyproject.toml ====="
          cat pyproject.toml

      - name: Debug Ruff Formatting
        run: |
          echo "===== Ruff Diff ====="
          ruff format --diff .

          echo ""
          echo "===== Git Diff ====="
          git diff

          echo ""
          echo "===== views.py ====="
          sed -n '1,250p' apps/knowledge/api/views.py

          echo ""
          echo "===== test_serializers.py ====="
          sed -n '1,250p' apps/knowledge/tests/test_serializers.py

          echo ""
          echo "===== test_services.py ====="
          sed -n '200,420p' apps/knowledge/tests/test_services.py

      - name: Ruff Format Check
        run: |
          ruff format --check .

      - name: Ruff Lint
        run: |
          ruff check .

      - name: MyPy
        run: |
          mypy .

      - name: Pytest
        env:
          POSTGRES_DB: incident_platform_test
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

          REDIS_URL: redis://localhost:6379/0

          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"

        run: |
          pytest