name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_platform_test
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements/*.txt"

      - name: Cache MyPy and Ruff caches
        uses: actions/cache@v4
        with:
          path: |
            backend/.mypy_cache
            backend/.ruff_cache
          key: ${{ runner.os }}-python-${{ hashFiles('backend/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-django
          pip install -r requirements/development.txt

      - name: Code Formatting Check (Ruff Format)
        run: |
          ruff format --check .

      - name: Linting Check (Ruff)
        run: |
          ruff check .

      - name: Type Checking (Mypy)
        run: |
          mypy .
      - name: Debug repository state
        run: |
          pwd
          git rev-parse HEAD
          git status
          git log --oneline -5
          find . -name "pyproject.toml"

      - name: Run Django Tests (Pytest)
        env:
          POSTGRES_DB: incident_platform_test
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
        run: |
          pytest
