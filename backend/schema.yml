          schema:
            type: string
            format: date-time
        - in: query
          name: created_at_before
          schema:
            type: string
            format: date-time
        - in: query
          name: created_by
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum:
              - CRITICAL
              - HIGH
              - LOW
              - MEDIUM
          description: |-
            * `CRITICAL` - Critical
            * `HIGH` - High
            * `MEDIUM` - Medium
            * `LOW` - Low
        - in: query
          name: status
          schema:
            type: string
            enum:
              - CLOSED
              - IDENTIFIED
              - INVESTIGATING
              - MITIGATING
              - OPEN
              - RESOLVED
          description: |-
            * `OPEN` - Open
            * `INVESTIGATING` - Investigating
            * `IDENTIFIED` - Identified
            * `MITIGATING` - Mitigating
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
      tags:
        - Timeline
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIncidentEventList"
          description: ""
components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        uploaded_by:
          allOf:
            - $ref: "#/components/schemas/UserMinimal"
          readOnly: true
        file:
          type: string
          format: uri
        filename:
          type: string
          maxLength: 255
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - file
        - filename
        - id
        - incident
        - uploaded_at
        - uploaded_by
    CategoryEnum:
      enum:
        - Infrastructure
        - Security
        - Application
        - Database
        - Network
        - Other
      type: string
      description: |-
        * `Infrastructure` - Infrastructure
        * `Security` - Security
        * `Application` - Application
        * `Database` - Database
        * `Network` - Network
