  /api/v1/incidents/{id}/status/:
    post:
      operationId: v1_incidents_status_create
      description:
        Transitions an incident to a new status (e.g. OPEN -> INVESTIGATING
        -> RESOLVED -> CLOSED).
      summary: Change incident status
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentStatus"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentStatus"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentStatus"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
          description: ""
        "400":
          description: Invalid status transition
  /api/v1/incidents/{id}/timeline/:
    get:
      operationId: v1_incidents_timeline_list
      description: Returns full audit timeline history of events logged for this incident.
      summary: Retrieve incident event timeline
      parameters:
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          schema:
            type: string
            enum:
