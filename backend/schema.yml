components:
  schemas:
    AIIncidentAnalysis:
      type: object
      description: Serializer for persistent AIIncidentAnalysis model records.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        summary:
          type: string
          readOnly: true
          description: AI-generated executive summary and security summary.
        root_cause:
          type: string
          readOnly: true
          description: AI-generated technical probable root cause analysis.
        severity_prediction:
          type: string
          readOnly: true
          description: AI-predicted severity classification.
        risk_score:
          type: number
          format: double
          readOnly: true
          description: Calculated risk score between 0.0 and 100.0.
        confidence_score:
          type: number
          format: double
          readOnly: true
          description: AI prediction confidence score between 0.0 and 1.0.
        recommendations:
          readOnly: true
          description: Structured remediation and prevention recommendations.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - confidence_score
        - created_at
        - id
        - incident
        - recommendations
        - risk_score
        - root_cause
        - severity_prediction
        - summary
        - updated_at
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        uploaded_by:
          allOf:
            - $ref: "#/components/schemas/UserMinimal"
          readOnly: true
        file:
          type: string
          format: uri
        filename:
          type: string
          maxLength: 255
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - file
        - filename
        - id
        - incident
        - uploaded_at
        - uploaded_by
    CategoryEnum:
      enum:
        - Infrastructure
        - Security
        - Application
        - Database
        - Network
        - Other
      type: string
      description: |-
        * `Infrastructure` - Infrastructure
        * `Security` - Security
        * `Application` - Application
        * `Database` - Database
        * `Network` - Network
        * `Other` - Other
    ChangePassword:
      type: object
      description: Serializer for logged-in user password change.
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
        - new_password
        - new_password_confirm
        - old_password
    Citation:
      type: object
      description: Serializer for a single source citation reference.
      properties:
        document_id:
          type: string
        document:
          type: string
        page:
          type: integer
        chunk:
          type: integer
        similarity:
          type: number
          format: double
        snippet:
          type: string
      required:
        - chunk
        - document
        - document_id
        - page
        - similarity
        - snippet
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
            - $ref: "#/components/schemas/UserMinimal"
          readOnly: true
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - author
        - created_at
        - id
        - incident
        - message
    CustomTokenObtainPair:
      type: object
      description: |-
        Custom SimpleJWT serializer augmenting JWT token with email-based authentication
        and additional payload claims (email, role, organization_id).
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
        - email
        - password
    DocumentStatus:
      type: object
      description:
        Serializer for polling document processing and vector indexing
        status.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: "#/components/schemas/Status15dEnum"
        processing_error:
          type: string
        page_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        word_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        chunk_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        embedding_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - updated_at
    EventTypeEnum:
      enum:
        - CREATED
        - STATUS_CHANGED
        - SEVERITY_CHANGED
        - ASSIGNED
        - COMMENT_ADDED
        - AI_ANALYSIS_COMPLETED
      type: string
      description: |-
        * `CREATED` - Created
        * `STATUS_CHANGED` - Status Changed
        * `SEVERITY_CHANGED` - Severity Changed
        * `ASSIGNED` - Assigned
        * `COMMENT_ADDED` - Comment Added
        * `AI_ANALYSIS_COMPLETED` - AI Analysis Completed
    FileTypeEnum:
      enum:
        - PDF
        - DOCX
        - TXT
        - MD
      type: string
      description: |-
        * `PDF` - PDF
        * `DOCX` - DOCX
        * `TXT` - TXT
        * `MD` - Markdown
    IncidentAIAnalyzeTrigger:
      type: object
      description: Serializer for manual AI analysis trigger response payload.
      properties:
        message:
          type: string
        incident_id:
          type: string
          format: uuid
        status:
          type: string
      required:
        - incident_id
        - message
        - status
    IncidentAnalysis:
      type: object
      description:
        Serializer for IncidentAnalysis model returning standardized Phase
        5 schema.
      properties:
        incident_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
            - $ref: "#/components/schemas/IncidentAnalysisStatusEnum"
          readOnly: true
        severity_prediction:
          type: string
          readOnly: true
        risk_score:
          type: number
          format: double
          readOnly: true
        category:
          type: string
          readOnly: true
        root_cause:
          type: string
          readOnly: true
        impact:
          type: string
          readOnly: true
        recommendations:
          readOnly: true
        confidence_score:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - category
        - confidence_score
        - created_at
        - impact
        - incident_id
        - recommendations
        - risk_score
        - root_cause
        - severity_prediction
        - status
        - updated_at
    IncidentAnalysisStatusEnum:
      enum:
        - pending
        - processing
        - completed
        - failed
      type: string
      description: |-
        * `pending` - Pending
        * `processing` - Processing
        * `completed` - Completed
        * `failed` - Failed
    IncidentAnalyzeRequest:
      type: object
      description: Serializer for incident analysis request payloads.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        logs:
          type: string
          default: ""
        severity:
          type: string
          default: ""
          maxLength: 50
        impact:
          type: string
          default: ""
          maxLength: 255
      required:
        - description
        - title
    IncidentAnalyzeResponse:
      type: object
      description: Serializer for incident analysis response outputs.
      properties:
        summary:
          type: string
        probable_root_cause:
          type: string
        root_cause:
          type: string
        affected_components:
          type: array
          items:
            type: string
        recommended_actions:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        severity_prediction:
          type: string
        risk_score:
          type: number
          format: double
        confidence_score:
          type: number
          format: double
      required:
        - summary
    IncidentAssign:
      type: object
      properties:
        assigned_to_id:
          type: string
          format: uuid
          nullable: true
    IncidentCreateUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        severity:
          $ref: "#/components/schemas/SeverityEnum"
        status:
          $ref: "#/components/schemas/Status231Enum"
        category:
          $ref: "#/components/schemas/CategoryEnum"
        assigned_to_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
      required:
        - title
    IncidentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        severity:
          $ref: "#/components/schemas/SeverityEnum"
        status:
          $ref: "#/components/schemas/Status231Enum"
        category:
          $ref: "#/components/schemas/CategoryEnum"
        created_by:
          allOf:
            - $ref: "#/components/schemas/UserMinimal"
          readOnly: true
        assigned_to:
          allOf:
            - $ref: "#/components/schemas/UserMinimal"
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_resolved:
          type: boolean
          readOnly: true
        is_closed:
          type: boolean
          readOnly: true
        comments:
          type: array
          items:
