openapi: 3.0.3
info:
  title: AI Incident Response Platform API
  version: 1.0.0
  description: Enterprise API for AI Incident Response Platform
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      description: Allows authenticated user to update their account password.
      summary: Change user password
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ChangePassword"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ChangePassword"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Password changed successfully.
        "400":
          description: Invalid password input.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description:
        Authenticates user using email and password, returning JWT access
        & refresh tokens alongside user info.
      summary: User Login (Obtain JWT token pair)
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomTokenObtainPair"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CustomTokenObtainPair"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CustomTokenObtainPair"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomTokenObtainPair"
          description: ""
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Returns profile information for the currently authenticated user.
      summary: Retrieve or update user profile
      tags:
        - Users
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
          description: ""
    put:
      operationId: v1_auth_me_update
      description: Returns profile information for the currently authenticated user.
      summary: Retrieve or update user profile
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UserDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UserDetail"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
          description: ""
    patch:
      operationId: v1_auth_me_partial_update
      description: Returns profile information for the currently authenticated user.
      summary: Retrieve or update user profile
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedUserDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedUserDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedUserDetail"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
          description: ""
  /api/v1/auth/organization/:
    get:
      operationId: v1_auth_organization_retrieve
      description: Returns organization details for the authenticated user's organization.
      summary: Retrieve or update current organization
      tags:
        - Organizations
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: ""
    put:
      operationId: v1_auth_organization_update
      description: Returns organization details for the authenticated user's organization.
      summary: Retrieve or update current organization
      tags:
        - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Organization"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Organization"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Organization"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: ""
    patch:
      operationId: v1_auth_organization_partial_update
      description: Returns organization details for the authenticated user's organization.
      summary: Retrieve or update current organization
      tags:
        - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedOrganization"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedOrganization"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedOrganization"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: ""
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: Takes a valid refresh token and returns a new access token.
      summary: Refresh JWT access token
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefresh"
          description: ""
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description:
        Registers a new enterprise user with email, password, role, and
        optional organization.
      summary: Register a new user account
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UserRegistration"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UserRegistration"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
        - {}
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
          description: ""
        "400":
          description: Validation error
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Returns operational status of API, Database, and Redis Cache.
      summary: System Health Check
      tags:
        - v1
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ""
  /api/v1/incidents/:
    get:
      operationId: v1_incidents_list
      description:
        Retrieves a paginated list of incidents belonging exclusively to
        the authenticated user's organization.
      summary: List organization incidents
      parameters:
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          schema:
            type: string
            enum:
              - Application
              - Database
              - Infrastructure
              - Network
              - Other
              - Security
          description: |-
            * `Infrastructure` - Infrastructure
            * `Security` - Security
            * `Application` - Application
            * `Database` - Database
            * `Network` - Network
            * `Other` - Other
        - in: query
          name: created_at_after
          schema:
            type: string
            format: date-time
        - in: query
          name: created_at_before
          schema:
            type: string
            format: date-time
        - in: query
          name: created_by
          schema:
            type: string
            format: uuid
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum:
              - CRITICAL
              - HIGH
              - LOW
              - MEDIUM
          description: |-
            * `CRITICAL` - Critical
            * `HIGH` - High
            * `MEDIUM` - Medium
            * `LOW` - Low
        - in: query
          name: status
          schema:
            type: string
            enum:
              - CLOSED
              - IDENTIFIED
              - INVESTIGATING
              - MITIGATING
              - OPEN
              - RESOLVED
          description: |-
            * `OPEN` - Open
            * `INVESTIGATING` - Investigating
            * `IDENTIFIED` - Identified
            * `MITIGATING` - Mitigating
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
      tags:
        - Incidents
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIncidentListList"
          description: ""
    post:
      operationId: v1_incidents_create
      description:
        Creates an incident within the authenticated user's organization
        and logs a timeline creation event.
      summary: Create a new incident
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreateUpdate"
          description: ""
  /api/v1/incidents/{id}/:
    get:
      operationId: v1_incidents_retrieve
      description:
        Retrieves comprehensive details of a specific incident including
        comments and event history.
      summary: Retrieve incident details
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
          description: ""
    put:
      operationId: v1_incidents_update
      description: Updates an existing incident.
      summary: Update incident
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreateUpdate"
          description: ""
    patch:
      operationId: v1_incidents_partial_update
      description: Partially updates an existing incident.
      summary: Partially update incident
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedIncidentCreateUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedIncidentCreateUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedIncidentCreateUpdate"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreateUpdate"
          description: ""
    delete:
      operationId: v1_incidents_destroy
      description: Deletes an incident (ADMIN access required).
      summary: Delete incident
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: No response body
  /api/v1/incidents/{id}/assign/:
    post:
      operationId: v1_incidents_assign_create
      description: Assigns or reassigns an incident to an organization user.
      summary: Assign incident to a team member
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAssign"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentAssign"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentAssign"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
          description: ""
        "400":
          description: Invalid user ID
  /api/v1/incidents/{id}/comments/:
    get:
      operationId: v1_incidents_comments_list
      description: GET lists all comments for the incident. POST posts a new comment.
