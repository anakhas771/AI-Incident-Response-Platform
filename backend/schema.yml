openapi: 3.0.3
info:
  title: AI Incident Response Platform API
  version: 1.0.0
  description: Enterprise API for AI Incident Response Platform with AI Engine and
    RAG Copilot
paths:
  /api/v1/ai/analysis/{incident_id}/:
    get:
      operationId: retrieve_incident_ai_analysis
      description: Returns the most recent stored AI analysis for a given incident
        ID.
      summary: Retrieve AI analysis for an incident
      parameters:
      - in: path
        name: incident_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIIncidentAnalysis'
          description: ''
  /api/v1/ai/analyze/:
    post:
      operationId: analyze_incident_payload
      description: Uses AI Engine to evaluate incident details and generate triage
        summary.
      summary: Analyze incident root cause and impact
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAnalyzeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IncidentAnalyzeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IncidentAnalyzeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAnalyzeResponse'
          description: ''
  /api/v1/ai/analyze/{incident_id}/:
    post:
      operationId: analyze_incident_by_id
      description: Triggers AI analysis for a database incident and stores results.
      summary: Analyze persistent incident by ID
      parameters:
      - in: path
        name: incident_id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIIncidentAnalysis'
          description: ''
  /api/v1/ai/incidents/{id}/analysis/:
    get:
      operationId: retrieve_phase5_incident_ai_analysis
      description: Returns the OneToOne IncidentAnalysis tracking asynchronous AI
        triage status and outputs.
      summary: Retrieve Phase 5 Incident AI analysis
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAnalysis'
          description: ''
  /api/v1/ai/incidents/{id}/analyze/:
    post:
      operationId: trigger_async_incident_ai_analysis
      description: Dispatches analyze_incident_task to Celery for an incident without
        blocking.
      summary: Trigger asynchronous AI analysis
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAIAnalyzeTriggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IncidentAIAnalyzeTriggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IncidentAIAnalyzeTriggerRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAIAnalyzeTrigger'
          description: ''
  /api/v1/ai/predict-severity/:
    post:
      operationId: predict_incident_severity
      description: Uses AI Engine to predict severity level and return a confidence
        score.
      summary: Predict incident severity classification
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeverityPredictRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SeverityPredictRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SeverityPredictRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeverityPredictResponse'
          description: ''
  /api/v1/ai/recommendations/:
    post:
      operationId: generate_incident_recommendations
      description: Uses AI Engine to synthesize mitigation steps and investigation
        checklist.
      summary: Generate AI response recommendations
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecommendationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecommendationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Allows authenticated user to update their account password.
      summary: Change user password
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully.
        '400':
          description: Invalid password input.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates user using email and password, returning JWT access
        & refresh tokens alongside user info.
      summary: User Login (Obtain JWT token pair)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile information for the currently authenticated user.
      summary: Retrieve or update user profile
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    put:
      operationId: auth_me_update
      description: Returns profile information for the currently authenticated user.
      summary: Retrieve or update user profile
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetailRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Returns profile information for the currently authenticated user.
      summary: Retrieve or update user profile
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/v1/auth/organization/:
    get:
      operationId: auth_organization_retrieve
      description: Returns organization details for the authenticated user's organization.
      summary: Retrieve or update current organization
      tags:
      - Organizations
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    put:
      operationId: auth_organization_update
      description: Returns organization details for the authenticated user's organization.
      summary: Retrieve or update current organization
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: auth_organization_partial_update
      description: Returns organization details for the authenticated user's organization.
      summary: Retrieve or update current organization
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Takes a valid refresh token and returns a new access token.
      summary: Refresh JWT access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Registers a new enterprise user with email, password, role, and
        optional organization.
      summary: Register a new user account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
        '400':
          description: Validation error
  /api/v1/copilot/chat/:
    post:
      operationId: copilot_chat_create
      description: Submit a prompt message to an existing conversation session and
        receive an AI response.
      summary: Execute Copilot chat turn
      tags:
      - copilot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopilotChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopilotChatRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotResponse'
          description: ''
  /api/v1/copilot/sessions/:
    get:
      operationId: copilot_sessions_list
      description: Retrieve all Enterprise AI Copilot conversation sessions for the
        authenticated user.
      summary: List chat sessions
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - copilot
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatSessionList'
          description: ''
    post:
      operationId: copilot_sessions_create
      description: Create a new Enterprise AI Copilot conversation session.
      summary: Create a chat session
      tags:
      - copilot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
  /api/v1/copilot/sessions/{id}/:
    get:
      operationId: copilot_sessions_retrieve
      description: Retrieve details of a specific Enterprise AI Copilot conversation
        session.
      summary: Get chat session detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - copilot
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
    put:
      operationId: copilot_sessions_update
      description: Update the title or archive status of a conversation session.
      summary: Update chat session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - copilot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSessionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSessionUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
    patch:
      operationId: copilot_sessions_partial_update
      description: Partially update the title or archive status of a conversation
        session.
      summary: Partially update chat session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - copilot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChatSessionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChatSessionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChatSessionUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
    delete:
      operationId: copilot_sessions_destroy
      description: Permanently delete a conversation session and all its messages.
      summary: Delete chat session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - copilot
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/copilot/sessions/{id}/messages/:
    get:
      operationId: copilot_sessions_messages_list
      description: Retrieve chronological message history for a specific conversation
        session.
      summary: List messages for a chat session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - copilot
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatMessageList'
          description: ''
    post:
      operationId: copilot_sessions_messages_create
      description: Submit a new message to the conversation session and trigger a
        Copilot response.
      summary: Send a chat message
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - copilot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotResponse'
          description: ''
  /api/v1/copilot/stream/:
    post:
      operationId: copilot_stream_create
      description: Submit a prompt message to an existing conversation session and
        stream AI response via Server-Sent Events.
      summary: Stream Copilot chat turn via SSE
      tags:
      - copilot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopilotChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopilotChatRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Returns operational status of API, Database, and Redis Cache.
      summary: System Health Check
      tags:
      - health
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/incidents/:
    get:
      operationId: incidents_list
      description: Retrieves a paginated list of incidents belonging exclusively to
        the authenticated user's organization.
      summary: List organization incidents
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
          format: uuid
      - in: query
        name: category
        schema:
          type: string
          enum:
          - Application
          - Database
          - Infrastructure
          - Network
          - Other
          - Security
        description: |-
          * `Infrastructure` - Infrastructure
          * `Security` - Security
          * `Application` - Application
          * `Database` - Database
          * `Network` - Network
          * `Other` - Other
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          * `CRITICAL` - Critical
          * `HIGH` - High
          * `MEDIUM` - Medium
          * `LOW` - Low
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - IDENTIFIED
          - INVESTIGATING
          - MITIGATING
          - OPEN
          - RESOLVED
        description: |-
          * `OPEN` - Open
          * `INVESTIGATING` - Investigating
          * `IDENTIFIED` - Identified
          * `MITIGATING` - Mitigating
          * `RESOLVED` - Resolved
          * `CLOSED` - Closed
      tags:
      - Incidents
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIncidentListList'
          description: ''
    post:
      operationId: incidents_create
      description: Creates an incident within the authenticated user's organization
        and logs a timeline creation event.
      summary: Create a new incident
      tags:
      - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IncidentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IncidentCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentCreateUpdate'
          description: ''
  /api/v1/incidents/{id}/:
    get:
      operationId: incidents_retrieve
      description: Retrieves comprehensive details of a specific incident including
        comments and event history.
      summary: Retrieve incident details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Incident.
        required: true
      tags:
      - Incidents
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
    put:
      operationId: incidents_update
      description: Updates an existing incident.
      summary: Update incident
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Incident.
        required: true
      tags:
      - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreateUpdateRequest'
