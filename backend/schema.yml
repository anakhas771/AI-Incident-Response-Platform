components:
  schemas:
    AIIncidentAnalysis:
      type: object
      description: Serializer for persistent AIIncidentAnalysis model records.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        summary:
          type: string
          readOnly: true
          description: AI-generated executive summary and security summary.
        root_cause:
          type: string
          readOnly: true
          description: AI-generated technical probable root cause analysis.
        severity_prediction:
          type: string
          readOnly: true
          description: AI-predicted severity classification.
        risk_score:
          type: number
          format: double
          readOnly: true
          description: Calculated risk score between 0.0 and 100.0.
        confidence_score:
          type: number
          format: double
          readOnly: true
          description: AI prediction confidence score between 0.0 and 1.0.
        recommendations:
          readOnly: true
          description: Structured remediation and prevention recommendations.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confidence_score
      - created_at
      - id
      - incident
      - recommendations
      - risk_score
      - root_cause
      - severity_prediction
      - summary
      - updated_at
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/UserMinimal'
          readOnly: true
        file:
          type: string
          format: uri
        filename:
          type: string
          maxLength: 255
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - file
      - filename
      - id
      - incident
      - uploaded_at
      - uploaded_by
    CategoryEnum:
      enum:
      - Infrastructure
      - Security
      - Application
      - Database
      - Network
      - Other
      type: string
      description: |-
        * `Infrastructure` - Infrastructure
        * `Security` - Security
        * `Application` - Application
        * `Database` - Database
        * `Network` - Network
        * `Other` - Other
    ChangePasswordRequest:
      type: object
      description: Serializer for logged-in user password change.
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    ChatMessage:
      type: object
      description: Serializer for individual Enterprise AI Copilot chat messages.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        tokens:
          type: integer
          readOnly: true
          description: Total tokens for this message.
        prompt_tokens:
          type: integer
          readOnly: true
          description: Prompt tokens used.
        completion_tokens:
          type: integer
          readOnly: true
          description: Completion tokens used.
        metadata:
          readOnly: true
          description: Extensible metadata dictionary.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completion_tokens
      - content
      - created_at
      - id
      - metadata
      - prompt_tokens
      - role
      - session
      - tokens
    ChatMessageCreateRequest:
      type: object
      description: Serializer for sending a new message to the Copilot.
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    ChatMessageRoleEnum:
      enum:
      - user
      - assistant
      - system
      - tool
      type: string
      description: |-
        * `user` - User
        * `assistant` - Assistant
        * `system` - System
        * `tool` - Tool
    ChatSession:
      type: object
      description: Serializer for Enterprise AI Copilot conversation session detail
        and listing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        last_message_preview:
          type: string
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
        token_count:
          type: integer
          readOnly: true
          description: Total tokens consumed in this session.
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_message_at
      - last_message_preview
      - organization
      - token_count
      - updated_at
      - user
    ChatSessionCreateRequest:
      type: object
      description: Serializer for creating a new Enterprise AI Copilot conversation
        session.
      properties:
        title:
          type: string
          minLength: 1
          default: New Chat
          maxLength: 255
    ChatSessionUpdateRequest:
      type: object
      description: Serializer for renaming or archiving an Enterprise AI Copilot conversation
        session.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        is_archived:
          type: boolean
    Citation:
      type: object
      description: Serializer for a single source citation reference.
      properties:
        document_id:
          type: string
        document:
          type: string
        page:
          type: integer
        chunk:
          type: integer
        similarity:
          type: number
          format: double
        snippet:
          type: string
      required:
      - chunk
      - document
      - document_id
      - page
      - similarity
      - snippet
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/UserMinimal'
          readOnly: true
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - incident
      - message
    CommentRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
      required:
      - message
    CopilotChatRequestRequest:
      type: object
      description: Serializer for Copilot chat and streaming execution requests.
      properties:
        session_id:
          type: string
          format: uuid
          description: UUID of the existing conversation session.
        message:
          type: string
          minLength: 1
          description: User prompt message to send to the Enterprise AI Copilot.
          maxLength: 4000
        question:
          type: string
          minLength: 1
          description: Alias for message.
          maxLength: 4000
      required:
      - session_id
    CopilotCitation:
      type: object
      description: Serializer for Copilot source citations.
      properties:
        document_id:
          type: string
          format: uuid
        document_title:
          type: string
        page:
          type: integer
        chunk_index:
          type: integer
        similarity:
          type: number
          format: double
        snippet:
          type: string
        highlight_start:
          type: integer
          default: 0
        highlight_end:
          type: integer
          default: 0
        source_url:
          type: string
          default: ''
        version:
