openapi: 3.0.3
info:
  title: AI Incident Response Platform API
  version: 1.0.0
  description: Enterprise API for AI Incident Response Platform
paths:
  /api/ai/analysis/{incident_id}/:
    get:
      operationId: ai_analysis_retrieve
      description:
        Returns the most recent stored AI analysis for a given incident
        ID.
      summary: Retrieve AI analysis for an incident
      parameters:
        - in: path
          name: incident_id
          schema:
            type: string
          required: true
      tags:
        - ai
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIIncidentAnalysis"
          description: ""
  /api/ai/analyze/:
    post:
      operationId: ai_analyze_create
      description:
        Uses AI Engine to evaluate incident details and generate triage
        summary.
      summary: Analyze incident root cause and impact
      tags:
        - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAnalyzeRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentAnalyzeRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentAnalyzeRequest"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalyzeResponse"
          description: ""
  /api/ai/analyze/{incident_id}/:
    post:
      operationId: ai_analyze_create_2
      description: Triggers AI analysis for a database incident and stores results.
      summary: Analyze persistent incident by ID
      parameters:
        - in: path
          name: incident_id
          schema:
            type: string
          required: true
      tags:
        - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIIncidentAnalysis"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AIIncidentAnalysis"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AIIncidentAnalysis"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIIncidentAnalysis"
          description: ""
  /api/ai/incidents/{id}/analysis/:
    get:
      operationId: ai_incidents_analysis_retrieve
      description:
        Returns the OneToOne IncidentAnalysis tracking asynchronous AI
        triage status and outputs.
      summary: Retrieve Phase 5 Incident AI analysis
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      tags:
        - ai
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalysis"
          description: ""
  /api/ai/incidents/{id}/analyze/:
    post:
      operationId: ai_incidents_analyze_create
      description:
        Dispatches analyze_incident_task to Celery for an incident without
        blocking.
      summary: Trigger asynchronous AI analysis
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      tags:
        - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAIAnalyzeTrigger"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentAIAnalyzeTrigger"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentAIAnalyzeTrigger"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAIAnalyzeTrigger"
          description: ""
  /api/ai/predict-severity/:
    post:
      operationId: ai_predict_severity_create
      description:
        Uses AI Engine to predict severity level and return a confidence
        score.
      summary: Predict incident severity classification
      tags:
        - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeverityPredictRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SeverityPredictRequest"
          multipart/form-data:
            schema:
