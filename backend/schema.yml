      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCommentList"
          description: ""
        "201":
          content:
            application/json:
              schema:
