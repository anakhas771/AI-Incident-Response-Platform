        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
    RecommendationRequestRequest:
      type: object
      description: Serializer for recommendation engine request payloads.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
        category:
          type: string
          default: ''
          maxLength: 100
        severity:
          type: string
          default: ''
          maxLength: 50
        affected_components:
          type: array
          items:
            type: string
      required:
      - description
      - title
    RecommendationResponse:
      type: object
      description: Serializer for recommendation engine response outputs.
      properties:
        immediate_mitigation_steps:
          type: array
          items:
            type: string
        investigation_checklist:
          type: array
          items:
            type: string
        prevention_recommendations:
          type: array
          items:
            type: string
        knowledge_citations:
          type: array
          items:
            type: object
            additionalProperties: {}
        rag_context_used:
          type: boolean
          default: false
      required:
      - immediate_mitigation_steps
      - investigation_checklist
      - prevention_recommendations
    RelatedDocument:
      type: object
      description: Serializer for a related knowledge document reference.
      properties:
        id:
          type: string
        title:
          type: string
        highest_similarity:
          type: number
          format: double
      required:
      - highest_similarity
      - id
      - title
    SeverityPredictRequestRequest:
      type: object
      description: Serializer for severity prediction request payloads.
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 100
        impact:
          type: string
          minLength: 1
          maxLength: 255
        affected_users:
          type: integer
          minimum: 0
        description:
          type: string
          minLength: 1
      required:
      - affected_users
      - category
      - description
      - impact
    SeverityPredictResponse:
      type: object
      description: Serializer for severity prediction response outputs.
      properties:
        predicted_severity:
          type: string
        confidence_score:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
      required:
      - confidence_score
      - predicted_severity
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserDetail:
      type: object
