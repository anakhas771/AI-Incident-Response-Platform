        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeverityPredictResponse"
          description: ""
  /api/ai/recommendations/:
    post:
      operationId: ai_recommendations_create
      description:
        Uses AI Engine to synthesize mitigation steps and investigation
