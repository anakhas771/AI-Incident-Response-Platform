            type: string
            enum:
              - CRITICAL
              - HIGH
              - LOW
              - MEDIUM
          description: |-
            * `CRITICAL` - Critical
            * `HIGH` - High
            * `MEDIUM` - Medium
            * `LOW` - Low
        - in: query
          name: status
          schema:
            type: string
            enum:
              - CLOSED
              - IDENTIFIED
              - INVESTIGATING
              - MITIGATING
              - OPEN
              - RESOLVED
          description: |-
            * `OPEN` - Open
            * `INVESTIGATING` - Investigating
            * `IDENTIFIED` - Identified
            * `MITIGATING` - Mitigating
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
      tags:
        - Comments
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCommentList"
          description: ""
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: ""
        "400":
          description: Invalid comment message
    post:
      operationId: v1_incidents_comments_create
      description: GET lists all comments for the incident. POST posts a new comment.
      summary: List or add incident comments
      parameters:
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          schema:
            type: string
            enum:
              - Application
              - Database
              - Infrastructure
              - Network
              - Other
              - Security
          description: |-
            * `Infrastructure` - Infrastructure
            * `Security` - Security
            * `Application` - Application
            * `Database` - Database
