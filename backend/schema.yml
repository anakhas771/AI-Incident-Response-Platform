        - in: query
          name: created_at_after
          schema:
            type: string
            format: date-time
        - in: query
          name: created_at_before
          schema:
            type: string
            format: date-time
        - in: query
          name: created_by
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum:
              - CRITICAL
              - HIGH
              - LOW
              - MEDIUM
          description: |-
            * `CRITICAL` - Critical
            * `HIGH` - High
            * `MEDIUM` - Medium
            * `LOW` - Low
        - in: query
          name: status
          schema:
            type: string
            enum:
              - CLOSED
              - IDENTIFIED
              - INVESTIGATING
              - MITIGATING
