  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Returns operational status of API, Database, and Redis Cache.
      summary: System Health Check
      tags:
        - v1
      security:
        - jwtAuth: []
        - cookieAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ""
  /api/v1/incidents/:
    get:
      operationId: v1_incidents_list
      description:
        Retrieves a paginated list of incidents belonging exclusively to
        the authenticated user's organization.
      summary: List organization incidents
      parameters:
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          schema:
            type: string
            enum:
              - Application
              - Database
              - Infrastructure
              - Network
              - Other
              - Security
          description: |-
            * `Infrastructure` - Infrastructure
            * `Security` - Security
            * `Application` - Application
            * `Database` - Database
            * `Network` - Network
            * `Other` - Other
        - in: query
          name: created_at_after
          schema:
            type: string
            format: date-time
        - in: query
          name: created_at_before
          schema:
            type: string
            format: date-time
        - in: query
          name: created_by
          schema:
            type: string
            format: uuid
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum:
              - CRITICAL
              - HIGH
              - LOW
              - MEDIUM
          description: |-
            * `CRITICAL` - Critical
            * `HIGH` - High
            * `MEDIUM` - Medium
            * `LOW` - Low
        - in: query
          name: status
          schema:
            type: string
            enum:
              - CLOSED
              - IDENTIFIED
              - INVESTIGATING
              - MITIGATING
              - OPEN
              - RESOLVED
          description: |-
            * `OPEN` - Open
            * `INVESTIGATING` - Investigating
            * `IDENTIFIED` - Identified
            * `MITIGATING` - Mitigating
            * `RESOLVED` - Resolved
            * `CLOSED` - Closed
      tags:
        - Incidents
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIncidentListList"
          description: ""
    post:
      operationId: v1_incidents_create
      description:
        Creates an incident within the authenticated user's organization
        and logs a timeline creation event.
      summary: Create a new incident
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreateUpdate"
          description: ""
  /api/v1/incidents/{id}/:
    get:
      operationId: v1_incidents_retrieve
      description:
        Retrieves comprehensive details of a specific incident including
        comments and event history.
      summary: Retrieve incident details
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
          description: ""
    put:
      operationId: v1_incidents_update
      description: Updates an existing incident.
      summary: Update incident
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IncidentCreateUpdate"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreateUpdate"
          description: ""
    patch:
      operationId: v1_incidents_partial_update
      description: Partially updates an existing incident.
      summary: Partially update incident
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedIncidentCreateUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedIncidentCreateUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedIncidentCreateUpdate"
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreateUpdate"
          description: ""
    delete:
      operationId: v1_incidents_destroy
      description: Deletes an incident (ADMIN access required).
      summary: Delete incident
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this Incident.
          required: true
      tags:
        - Incidents
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: No response body
  /api/v1/incidents/{id}/assign/:
    post:
      operationId: v1_incidents_assign_create
      description: Assigns or reassigns an incident to an organization user.
      summary: Assign incident to a team member
      parameters:
        - in: path
          name: id
          schema:
