  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      description: Allows authenticated user to update their account password.
      summary: Change user password
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ChangePassword"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ChangePassword"
        required: true
      security:
        - jwtAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Password changed successfully.
        "400":
          description: Invalid password input.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description:
        Authenticates user using email and password, returning JWT access
        & refresh tokens alongside user info.
      summary: User Login (Obtain JWT token pair)
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomTokenObtainPair"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CustomTokenObtainPair"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CustomTokenObtainPair"
        required: true
