<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Invitation</title>
</head>
<body>
    <h2>You’ve been invited to {{ org_name }}</h2>

    <p>Hello,</p>

    <p>
        {{ inviter_name }} invited you to join <strong>{{ org_name }}</strong>
        as a <strong>{{ role }}</strong>.
    </p>

    <p>
        Use the invitation token below to accept the invitation:
    </p>

    <p>
        <strong>{{ token }}</strong>
    </p>

    <p>
        This invitation expires in 7 days.
    </p>
</body>
</html>
