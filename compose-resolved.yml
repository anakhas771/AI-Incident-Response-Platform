name: ai-incident-response-platform
services:
  backend:
    build:
      context: C:\Users\acer\Desktop\AI-Incident-Response-Platform\backend
      dockerfile: Dockerfile
      target: development
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    container_name: incident_platform_backend
    depends_on:
      db:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      AI_API_KEY: ""
      AI_MODEL: gpt-4-turbo
      AI_PROVIDER: mock
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      CELERY_TASK_DEFAULT_QUEUE: default
      CHUNK_OVERLAP: "100"
      CHUNK_SIZE: "500"
      COPILOT_LLM_MAX_RETRIES: "2"
      COPILOT_LLM_MAX_TOKENS: "2048"
      COPILOT_LLM_MODEL: qwen3:4b-instruct-2507-q4_K_M
      COPILOT_LLM_PROVIDER: openai
      COPILOT_LLM_TEMPERATURE: "0.2"
      COPILOT_LLM_TIMEOUT: "60"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.development
      EMBEDDING_API_KEY: ""
      EMBEDDING_DIMENSION: "1536"
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_PROVIDER: mock
      ENVIRONMENT: development
      OPENAI_API_KEY: <scrubbed>
      POSTGRES_DB: incident_platform_db
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres_secure_password_dev
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres_user
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key
      VECTOR_SEARCH_TOP_K: "5"
      VECTOR_SIMILARITY_THRESHOLD: "0.7"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health/")'
          || exit 1
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 15s
    networks:
      app-network: null
    ports:
      - mode: ingress
        target: 8000
        published: "8000"
        protocol: tcp
    volumes:
      - type: bind
        source: C:\Users\acer\Desktop\AI-Incident-Response-Platform\backend
        target: /app
        bind: {}
  celery_beat:
    build:
      context: C:\Users\acer\Desktop\AI-Incident-Response-Platform\backend
      dockerfile: Dockerfile
      target: development
    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info
    container_name: incident_platform_celery_beat
    depends_on:
      backend:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      AI_API_KEY: ""
      AI_MODEL: gpt-4-turbo
      AI_PROVIDER: mock
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      CELERY_TASK_DEFAULT_QUEUE: default
      CHUNK_OVERLAP: "100"
      CHUNK_SIZE: "500"
      COPILOT_LLM_MAX_RETRIES: "2"
      COPILOT_LLM_MAX_TOKENS: "2048"
      COPILOT_LLM_MODEL: qwen3:4b-instruct-2507-q4_K_M
      COPILOT_LLM_PROVIDER: openai
      COPILOT_LLM_TEMPERATURE: "0.2"
      COPILOT_LLM_TIMEOUT: "60"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.development
      EMBEDDING_API_KEY: ""
      EMBEDDING_DIMENSION: "1536"
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_PROVIDER: mock
      ENVIRONMENT: development
      OPENAI_API_KEY: <scrubbed>
      POSTGRES_DB: incident_platform_db
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres_secure_password_dev
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres_user
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key
      VECTOR_SEARCH_TOP_K: "5"
      VECTOR_SIMILARITY_THRESHOLD: "0.7"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, sys; any('beat' in open(f'/proc/{p}/cmdline', 'rb').read().decode('utf-8',
          'ignore') and p != str(os.getpid()) for p in os.listdir('/proc') if p.isdigit())
          or sys.exit(1)"
      timeout: 5s
      interval: 15s
      retries: 5
      start_period: 15s
    networks:
      app-network: null
    volumes:
      - type: bind
        source: C:\Users\acer\Desktop\AI-Incident-Response-Platform\backend
        target: /app
        bind: {}
  celery_worker:
    build:
      context: C:\Users\acer\Desktop\AI-Incident-Response-Platform\backend
      dockerfile: Dockerfile
      target: development
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - --concurrency=4
      - -Q
      - default,ai_tasks
    container_name: incident_platform_celery_worker
    depends_on:
      backend:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      AI_API_KEY: ""
      AI_MODEL: gpt-4-turbo
      AI_PROVIDER: mock
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      CELERY_TASK_DEFAULT_QUEUE: default
      CHUNK_OVERLAP: "100"
      CHUNK_SIZE: "500"
      COPILOT_LLM_MAX_RETRIES: "2"
      COPILOT_LLM_MAX_TOKENS: "2048"
      COPILOT_LLM_MODEL: qwen3:4b-instruct-2507-q4_K_M
      COPILOT_LLM_PROVIDER: openai
      COPILOT_LLM_TEMPERATURE: "0.2"
      COPILOT_LLM_TIMEOUT: "60"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.development
      EMBEDDING_API_KEY: ""
      EMBEDDING_DIMENSION: "1536"
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_PROVIDER: mock
      ENVIRONMENT: development
      OPENAI_API_KEY: <scrubbed>
      POSTGRES_DB: incident_platform_db
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres_secure_password_dev
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres_user
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key
      VECTOR_SEARCH_TOP_K: "5"
      VECTOR_SIMILARITY_THRESHOLD: "0.7"
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A config status || exit 1
      timeout: 10s
      interval: 15s
      retries: 5
      start_period: 20s
    networks:
      app-network: null
    volumes:
      - type: bind
        source: C:\Users\acer\Desktop\AI-Incident-Response-Platform\backend
        target: /app
        bind: {}
  db:
    container_name: incident_platform_db
    environment:
      POSTGRES_DB: incident_platform_db
      POSTGRES_PASSWORD: postgres_secure_password_dev
      POSTGRES_USER: postgres_user
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres_user -d incident_platform_db
      timeout: 5s
      interval: 5s
      retries: 5
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: C:\Users\acer\Desktop\AI-Incident-Response-Platform\infrastructure\docker\postgres\init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        bind: {}
  frontend:
    build:
      context: C:\Users\acer\Desktop\AI-Incident-Response-Platform\frontend
      dockerfile: Dockerfile
      target: development
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    container_name: incident_platform_frontend
    depends_on:
      backend:
        condition: service_started
        required: true
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    networks:
      app-network: null
    ports:
      - mode: ingress
        target: 5173
        published: "5173"
        protocol: tcp
    volumes:
      - type: bind
        source: C:\Users\acer\Desktop\AI-Incident-Response-Platform\frontend
        target: /app
        bind: {}
      - type: volume
        target: /app/node_modules
        volume: {}
  redis:
    container_name: incident_platform_redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
      interval: 5s
      retries: 5
    image: redis:7-alpine
    networks:
      app-network: null
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume: {}
networks:
  app-network:
    name: ai-incident-response-platform_app-network
    driver: bridge
volumes:
  postgres_data:
    name: ai-incident-response-platform_postgres_data
  redis_data:
    name: ai-incident-response-platform_redis_data
